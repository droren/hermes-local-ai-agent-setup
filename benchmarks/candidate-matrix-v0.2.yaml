version: 1
status: candidate_only
source: cold_model_library_inventory_2026-08-22

principles:
  - No model is considered preferred until measured locally.
  - Prefer models already staged on local SSD when quality is close.
  - Cold models must be copied from UNAS to local SSD before benchmark or use.
  - External/cloud manifest entries are excluded from local capability competition.
  - Benchmark small models first because the target architecture favors parallel specialists.

