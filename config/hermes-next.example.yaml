version: 1
profile:
  name: hermes-next
  isolation_mode: experimental

principles:
  local_first: true
  reuse_before_create: true
  evidence_before_action: true
  external_default: deny

paths:
  state: ~/.hermes-next/state
  cache: ~/.hermes-next/cache
  writable_memory: ~/.hermes-next/memory
  shared_skills: ~/.hermes/skills
  shared_knowledge: ~/.hermes/knowledge

shared_resources:
  skills_mode: read_only
  knowledge_mode: read_only

workflow:
  default: feature_lifecycle
  approval_after_planning: true
  independent_review: true
  independent_testing: true

trust:
  fast_path_requires_operator_enablement: true
  successful_runs_before_suggestion: 3

models:
  catalog: ./model-catalog.yaml
