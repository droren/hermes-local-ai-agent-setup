version: 2

# Capability-driven model catalog for a 48 GB Apple Silicon AI host.
# Model names are defaults, not hard dependencies. Hermes should match
# capabilities first and concrete models second.

host_profiles:
  mac_m4_pro_48gb:
    unified_memory_gb: 48
    reserve_for_os_and_runtime_gb: 10
    target_model_budget_gb: 38
    policy:
      prefer_parallel_small_models: true
      prefer_local_execution: true
      external_execution: escalation_only
      avoid_multiple_large_dense_models: true

models:
  - id: local-router-small
    backend: ollama
    endpoint: http://AI_HOST:11434
    model: qwen3.5:4b
    execution_class: local
    role_class: utility
    memory_gb_estimate: 4
    max_parallel: 3
    preferred_for:
      - request classification
      - capability routing
      - compact summaries
      - task metadata extraction
    capabilities:
      - routing.classify
      - summarization.compact
      - structured_output
      - reasoning.light

  - id: local-worker-small
    backend: ollama
    endpoint: http://AI_HOST:11434
    model: qwen3.5:9b
    execution_class: local
    role_class: worker
    memory_gb_estimate: 8
    max_parallel: 2
    preferred_for:
      - bounded code changes
      - test generation
      - documentation
      - repository inspection
    capabilities:
      - code.implement.small
      - code.review.light
      - test.design
      - docs.write
      - tool_calling
      - structured_output
      - reasoning.medium

  - id: local-code-specialist-moe
    backend: ollama
    endpoint: http://AI_HOST:11434
    model: qwen3.5:35b-a3b-coding-nvfp4
    execution_class: local
    role_class: senior_worker
    memory_gb_estimate: 21
    max_parallel: 1
    notes:
      - MoE model with roughly 3B active parameters per token.
      - Use when small workers fail or a task needs stronger agentic coding.
      - Keep enough memory free for one or two small utility agents.
    capabilities:
      - code.implement
      - code.review
      - test.design
      - planning.decomposition
      - architecture.reasoning.medium
      - tool_calling
      - structured_output
      - reasoning.deep

  - id: local-quality-reserve-dense
    backend: mlx
    endpoint: http://AI_HOST:18083/v1
    model: Qwen3.6-27B-4bit
    execution_class: local
    role_class: quality_reserve
    memory_gb_estimate: 18
    max_parallel: 1
    policy:
      default_enabled: false
      activation: benchmark_or_escalation
    notes:
      - Dense model intended for difficult one-shot reasoning or code review.
      - Prefer the MoE senior worker for normal operation to preserve throughput.
    capabilities:
      - code.review.deep
      - architecture.reasoning
      - reasoning.deep
      - planning.decomposition
      - structured_output

  - id: local-embedding
    backend: ollama
    endpoint: http://AI_HOST:11434
    model: nomic-embed-text
    execution_class: local
    role_class: retrieval
    memory_gb_estimate: 1
    max_parallel: 4
    capabilities:
      - retrieval.embedding
      - knowledge.index

  - id: external-research-or-escalation
    backend: existing-hermes-provider
    execution_class: external
    role_class: escalation
    external_policy: escalation_only
    capabilities:
      - research.web.current
      - architecture.reasoning
      - reasoning.deep
      - code.review.deep

routing_policy:
  order:
    - retrieve_existing_knowledge
    - reuse_existing_solution
    - decompose_if_needed
    - local_router_small
    - local_worker_small
    - local_code_specialist_moe
    - local_quality_reserve_dense
    - external_research_or_escalation

  escalation_rules:
    - external models MUST NOT be selected merely because they are stronger.
    - first attempt task decomposition and local delegation.
    - external research is allowed when current web knowledge is materially required.
    - external architecture/reasoning requires an explicit escalation reason in the task log.
    - send the minimum necessary project context externally.

parallel_profiles:
  normal:
    description: Multiple bounded tasks executed locally.
    recommended:
      - 1x local-router-small
      - 2x local-worker-small

  mixed_review:
    description: Strong coding/review task plus lightweight supporting agents.
    recommended:
      - 1x local-code-specialist-moe
      - 1x local-router-small
      - 1x local-embedding

  deep_local:
    description: Highest local quality; sacrifice parallelism.
    recommended:
      - 1x local-quality-reserve-dense
      - 1x local-router-small
